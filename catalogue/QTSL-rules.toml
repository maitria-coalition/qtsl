'''
note = 'NEW ROW (cyclic assume--guarantee design: the premise-shaped liveness charter + the schedule walk; the value column forced by a machine-checked countermodel --- the swap loop with swap-closed marks satisfies every premise-only hypothesis while its unique behaviour avoids the marks --- and generalized to a carve column: pins are predicates, values being measure-zero in general; exact value pins survive as the degenerate diagonal species, subsumption machine-checked). Schema: BAKED at revision event 5 of the extension theory: \texttt{QWireComposeMarks} \{proof, components, wirecert, latency\_rows, schedule, carves (wire, gate --- the scalar-gate genus reused under \texttt{qtsl\_gate\_scalar}), carve\_rows (containment + carved-delivery pairs), diagonal\_rows (species-tagged diagonal certificates: point/enum/contract/convex/monotone, closed genus), entailment, wellposedness\}; \texttt{qtsl\_wire\_markflow} demanded on every instance; guard elimination at consumption inherited from the guarded-introduction law. Scope fence, deliberate: single-dip graded-reach marks (finitely realizable, extension-persistent); recurrence-shaped liveness (Streett/GF) stays outside both cyclic variants. Honest incompleteness, priced: $\forall\exists$ premises can be false while a joint witness exists (favourite-input deliveries) --- the strategy form is the recovery road.'
