# from design rulings; revisable, not verbatim). RIGHT is what the
# staged `QtslCert` revision of the extension theory actually realizes
# today — the declarations-only certificate schema (judgement kinds,
# rule sorts, recompute registry, and the later-enacted `qraAffine`
# affine region atom) — rendered into the same metanotation, authored
# from the staged sorts' field rosters and the recompute registry. An EMPTY right column is the
# honest state: the rule is catalogued and tiered but has no staged
# realization (the catalogue's MISSING-ROW findings) — on this page,
# absence renders loudly instead of not rendering at all (the reason the
# page exists: the 2026-07-19 review catch that QTSL's rules were
# invisible in the rule book rather than shown-as-uncovered).
#
# Population: exactly the catalogue ledger's 34 rule rows — 33 tiered
# (12 core + 8 admissible + 13 alias, QAGCompose counted once with its
# per-profile tier split rendered in the badge) + 1 edge discipline
# (TowerCitation, the GLUE category: the fourth tier category per the
# TowerCitation rendering decision, 2026-07-19,
# counted apart from the tiered rows) — plus one tier-less row
# for the ⊨ judgment kinds (the sp-axiom precedent: not a proof rule,
# skipped by the book dashboard). Side-condition registry entries,
# deliberate absences, and the named-open MIX judgment are colophon prose, not
# rows — they are deliberately not rules, and rows would misstate that.
#
# MARKS: derived-live discipline unchanged (src/marks.rs), now probing
# BOTH Lean packages (2026-07-19, the multi-package plumbing leg):
# `lemmas` resolves through the main package (`import Qtsl`,
# PPLC namespace or fully-qualified); `aux_lemmas` resolves through the
# separate qtsl-aux package (`import QtslAux`, fully-qualified
# names only). The former package-boundary rule (aux warrants as prose,
# rows unmarked) is retired — the probe reaches the battery / excursion /
# AG-composition corpus now. Partial honesty rides `scope`: a check with
# a superscript scope tag warrants exactly the proven fragment/profile
# named in the witness prose, never the whole catalogued rule.
#
# TIER AMBIGUITIES are flagged in notes as AMBIGUOUS rather than forced
# (flagged, never forced, where genuinely arguable); the flagged
# set: QLatticeInv, QNegFAlias, StreettTargetCellCollapse
# (T9c side-condition weight). Resolved 2026-07-19:
# QAGCompose (per-profile split now rendered in the tier badge, ratified)
# and TowerCitation (rule-vs-discipline — re-categoried
# GLUE, the fourth category, per its rendering decision).
#
# Re-render: cd metanotation && cargo run --release --bin qtsl-rules -- \
#   --rules QTSL-rules.toml --no-verify

