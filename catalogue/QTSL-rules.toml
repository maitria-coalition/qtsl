the $\exists$-face sibling of \rulename{QWireCompose}: same wiring premise vocabulary, opposite polarity economics. \textbf{No causality certificate, no ranks, no guard column} --- a dip under a mark survives every extension, so a cyclic wiring conspires \emph{for} the conclusion, and the well-foundedness kit appears precisely in the rule whose conclusion face is $\mathsf{ForallSpec}$, never here. In its place, one composite-level ingredient in two columns: the $\mathsf{MarkFlow}$ walk --- the $\exists$-dual of the causality walk, same arithmetic species (difference constraints over the declaration closure, bounded recompute), opposite verdict role: the $\forall$-walk demands strict increase along every wire, refusing all cycles; this walk demands \emph{consistency}, admitting every cycle whose schedule closes and refusing time-travel. Its stage arithmetic forces every dependency cycle to total lag zero with one shared label --- so the cycles the rule admits are exactly the instantaneous self-supporting loops, and there the walk\textquotesingle s carve column takes over: producer-supplied \emph{carves} (one predicate per cycle mark, presented as a scalar-codomain gate hypernet cited by digest --- its sign-fiber the carve; a plated aggregate gate for token-population members; never a trace, and never a bare point of a continuous state space) checked by containment arithmetic, carved-delivery citations, and one diagonal certificate per cycle asserting the instant loop closes jointly \emph{inside} the carve product --- the discriminant carve-invariance alone provably misses. Exact value pins survive as the degenerate diagonal species, honest exactly where states are finitely presentable. Off the cycles no carve is needed: the $\forall\exists$ premises chain deliveries in topological order, producer-side --- and the premises themselves are the maximal-carve rows, so the whole column is the rule\textquotesingle s own premise form run at tighter predicates. The conclusion