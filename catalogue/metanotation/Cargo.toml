[package]
name = "qtsl-metanotation"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Two-column token-diff typesetter for the Bernstein Logic derivation rules (Steele metanotation; original | amended, SafeVerify marks in the outer margin)"

[[bin]]
name = "qtsl-rules"
path = "src/main.rs"

[[bin]]
name = "qtsl-book"
path = "src/book_main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.3"

[dev-dependencies]
proptest = "1.11.0"
