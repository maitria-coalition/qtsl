# api-system.toml.d/S-CIRCUIT.toml — the System Catalogue entry's
# producer-API section (one fragment per
# coverage-matrix S-row, stem = id). Everything rendered is extracted
# from the toolkit sources at emission; specs here are pointers, never
# quoted text. Emit/verify: `qtsl-book api-tex` / `qtsl-book check`.

[api]
id = "S-CIRCUIT"
entity = "model type"

[api.ts]
handle = "system.circuit"
sig_file = "ts/src/system.ts"
sig = ["marker:ts_sig_circuit"]
note = '''The TS conformance corpus holds no construction through this factory at this preview --- the cross-language byte-identity fixtures exercise six profiles, and this one's byte authority is the Rust corpus opposite; the factory takes the same init-object vocabulary as every other profile.'''

[api.rust]
handle = "mtk_catalogue::system::presets::Circuit::manifest"
sig_file = "crates/mtk-catalogue/src/system/presets.rs"
sig = ["marker:preset_circuit"]
snippet_file = "crates/mtk-catalogue/tests/builders.rs"
snippet = "marker:circuit_happy"
