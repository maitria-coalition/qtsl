# api-system.toml.d/S-DTMC.toml — the System Catalogue entry's
# producer-API section (one fragment per
# coverage-matrix S-row, stem = id). Everything rendered is extracted
# from the toolkit sources at emission; specs here are pointers, never
# quoted text. Emit/verify: `qtsl-book api-tex` / `qtsl-book check`.

[api]
id = "S-DTMC"
entity = "model type"

[api.ts]
handle = "system.dtmc"
sig_file = "ts/src/system.ts"
sig = ["marker:ts_sig_dtmc", "marker:ts_sig_dtmcgen"]
snippet_file = "ts/tests/system-native.test.ts"
snippet = "fn-body:buildDtmc"
note = '''The quoted construction is the committed cross-language byte-identity vector's own (the chain-3 mechanism), and the generator kit's closed-form control --- transfer and generator on that same presentation, the absorbing self-loop's computed zero included --- rides the test suite beside it. The kit's Rust face is \texttt{mtk\_catalogue::system::dtmc\_gen\_kit}.'''

[api.rust]
handle = "mtk_catalogue::system::presets::Dtmc::manifest"
sig_file = "crates/mtk-catalogue/src/system/presets.rs"
sig = ["marker:preset_dtmc"]
snippet_file = "crates/mtk-catalogue/tests/common/mod.rs"
snippet = "fn-body:dtmc"
