# api-system.toml.d/S-PDE.toml — the System Catalogue entry's
# producer-API section (one fragment per
# coverage-matrix S-row, stem = id). Everything rendered is extracted
# from the toolkit sources at emission; specs here are pointers, never
# quoted text. Emit/verify: `qtsl-book api-tex` / `qtsl-book check`.

[api]
id = "S-PDE"
entity = "model type"

[api.ts]
handle = "system.pde"
sig_file = "ts/src/system.ts"
sig = ["marker:ts_sig_pde", "marker:ts_sig_pdegen"]
snippet_file = "ts/tests/system-native.test.ts"
snippet = "fn-body:buildPde"

[api.rust]
handle = "mtk_catalogue::system::presets::Pde::manifest"
sig_file = "crates/mtk-catalogue/src/system/presets.rs"
sig = ["marker:preset_pde"]
snippet_file = "crates/mtk-catalogue/tests/builders.rs"
snippet = "marker:pde_happy"
note = '''The derived kit's Rust face is \texttt{mtk\_catalogue::system::pde\_gen\_kit} --- the canonical differential-polynomial right-hand side per field component at the extended index space, the producer face of the mechanized declared-data compile edge; the quoted TS construction is the committed \texttt{viscous-burgers-jet} golden vector's own presentation.'''
