note = '''The TS corpus exercises this factory through its refusal geometry (the corpus's discipline that failure geometry is routing advice); the quoted construction is that witness, and the happy-path byte authority is the Rust corpus opposite --- the machine-repair mechanism is a committed cross-language byte-identity vector, and the generator kit's closed-form control is its own certified values. The kit's Rust face is \texttt{mtk\_catalogue::system::ctmc\_gen\_kit}.'''

[api.rust]
handle = "mtk_catalogue::system::presets::Ctmc::manifest"
sig_file = "crates/mtk-catalogue/src/system/presets.rs"
sig = ["marker:preset_ctmc"]
