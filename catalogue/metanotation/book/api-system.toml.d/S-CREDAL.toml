# api-system.toml.d/S-CREDAL.toml — the System Catalogue entry's
# producer-API section (one fragment per
# coverage-matrix S-row, stem = id). Everything rendered is extracted
# from the toolkit sources at emission; specs here are pointers, never
# quoted text. Emit/verify: `qtsl-book api-tex` / `qtsl-book check`.

[api]
id = "S-CREDAL"
entity = "composition pattern"
ts_absent = '''The pattern-level TypeScript binding is not yet arranged: the manifest-level wiring descriptors (\texttt{WiringRow}, \texttt{SwitchEdge}, \texttt{ScheduleAssumption}) already ride the TS \texttt{system} namespace (\texttt{system.composite}), while the pattern builders and the four pattern row families are Rust-only at this preview.'''

[api.rust]
handle = "mtk_catalogue::compose::quantified_hull"
sig_file = "crates/mtk-catalogue/src/compose/credal.rs"
sig = ["fn declared_resolution", "fn quantified_hull"]
snippet_file = "crates/mtk-catalogue/tests/compose_common/mod.rs"
snippet = "fn-body:credal_hull_decl"
note = '''The declared grade (one vertex of the hull) is the corpus's \texttt{credal\_declared\_decl} sibling fixture.'''
