# api.toml — [meta] spine for the producer-API sections (api.rs).
# Per-entry fragments live in api.toml.d/, one per book entry (fan
# seam: stem = id). Source paths in fragments use the public mtk
# repository layout; the resolver also accepts the workshop layout
# (same paths without the `crates/` prefix).

[meta]
# The mtk toolkit source tree the extractor reads, crate-relative:
# the sibling mtk repository checkout (the experiments chapter's
# sibling-clone convention). Until the toolkit package migration into
# the mtk repository completes, regeneration passes --api-src pointing
# at a toolkit tree that carries `mtk-catalogue/` and `ts/`.
toolkit_root = "../../../mtk"

# Standalone API-block groups: entries of a hand-authored catalogue
# chapter (no [[rule]] section). `qtsl-book api-blocks` renders each
# id's block to <dir>/<id>.tex (dir repository-root-relative) for the
# chapter to \input at its per-entry anchor; check/render re-extract
# them like every rule block. See book/DESIGN.md, API sections.

# The Primitive Catalogue (book/chapters/qtsl-hypernets.tex): the 13
# H-family rows — ten primitive boxes, the container, substitution,
# and the well-formedness preflight. `ids` order is the CHAPTER's
# render order (H-WF opens the catalogue), load-bearing for the
# sourcenote dedup: the full provenance note prints at the first id
# only, sourcenote_rest at the rest.
[[standalone]]
dir = "book/chapters/qtsl-hypernets-api"
sourcenote = '''Producer surface of the \texttt{mtk} toolkit for this catalogue entry: the TypeScript arrangement (npm package \texttt{@maitria/mtk}, \texttt{hypernet} namespace) and the Rust catalogue crate (\texttt{crates/mtk-catalogue}) --- one Rust implementation underneath, reached from TypeScript in-process through a native binding, so the two surfaces cannot diverge. Signatures and constructions are extracted from the toolkit sources at every regeneration of this block; each construction is quoted verbatim from the toolkit's hypernet conformance corpus, code whose emitted canonical graph bytes are verified byte-identical against golden vectors generated by the reference implementation (the corpus's fixture graphs --- an all-ten-primitives graph, an identity, a substitution composite, and the fifteen-application drift of this chapter's worked example --- are the receipts). This API constructs and emits; it never checks --- the checker re-derives every claim independently. Later entries of this catalogue cite this note rather than repeating it.'''
sourcenote_rest = '''Producer API of the \texttt{mtk} toolkit --- the TypeScript arrangement and the Rust catalogue crate, one implementation underneath. The extraction, corpus, and receipt disciplines governing this block are stated once, at \hyperref[prim:H-WF]{this catalogue's first entry}.'''
ids = [
  "H-WF", "H-GRAPH", "H-CONST", "H-CONTRACT", "H-CAST",
  "H-RESHAPE", "H-BROADCAST", "H-COPY", "H-DELETE", "H-SWAP",
  "H-CELL", "H-STACK", "H-SUBST",
]
