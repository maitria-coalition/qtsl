[rule.hol]
status = "absent"
reason = '''
The satisfaction-judgement extension postdates the HOL4 port entirely:
the ported cone is the base calculus\textquotesingle s first-order
check-function surface (theory \texttt{qtsl\_catalogue}, stopping
before even the base proof-object layer), and no extension-theory
definition exists anywhere in the HOL development. A HOL statement of
this rule presupposes a HOL port of the satisfaction stratum, which is
its own campaign; until then this box is the honest state of the
edifice.
'''
