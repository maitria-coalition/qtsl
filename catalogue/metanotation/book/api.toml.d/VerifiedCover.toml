# api.toml.d/VerifiedCover.toml — the entry's producer-API section (one
# fragment per entry, stem = id). Everything
# rendered is extracted from the toolkit sources at build time; specs
# here are pointers, never quoted text. See DESIGN.md §API sections.

[api]
id = "VerifiedCover"

[api.ts]
handle = "rules.qtslCore.verifiedCover"
sig_file = "ts/src/rules/qtsl-core.ts"
sig = ["fn verifiedCover", "interface VerifiedCoverArgs"]
snippet_file = "ts/tests/rules-qtsl-golden.test.ts"
snippet = "conform:qtsl_verified_cover.v0.cbor"

[api.rust]
handle = "mtk_catalogue::rules::qtsl_core::verified_cover"
sig_file = "crates/mtk-catalogue/src/rules/qtsl_core/discharge.rs"
sig = ["fn verified_cover"]
snippet_file = "crates/mtk-catalogue/tests/qtsl_common/mod.rs"
snippet = "fn-body:fx_verified_cover"
