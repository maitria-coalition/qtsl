# api.toml.d/SugarBatch.toml — the entry's producer-API section (one
# fragment per entry, stem = id). Everything
# rendered is extracted from the toolkit sources at build time; specs
# here are pointers, never quoted text. See DESIGN.md §API sections.

[api]
id = "SugarBatch"
note = '''One parameterized builder serves the three definitional sugars; the \texttt{Sugar} variant argument selects the spelling. The corpus constructs all three; the avoid-sugar construction is quoted.'''

[api.ts]
handle = "rules.qtslCore.sugar"
sig_file = "ts/src/rules/qtsl-core.ts"
sig = ["fn sugar", "interface SugarArgs"]
snippet_file = "ts/tests/rules-qtsl-golden.test.ts"
snippet = "conform:qtsl_sugar_avoid.v0.cbor"

[api.rust]
handle = "mtk_catalogue::rules::qtsl_core::sugar"
sig_file = "crates/mtk-catalogue/src/rules/qtsl_core/surface.rs"
sig = ["fn sugar"]
snippet_file = "crates/mtk-catalogue/tests/qtsl_common/mod.rs"
snippet = "fn-body:fx_sugar_avoid"
