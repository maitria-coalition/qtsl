# api.toml.d/H-CONST.toml — the entry's producer-API section (one
# fragment per entry, stem = id). Everything
# rendered is extracted from the toolkit sources at build time; specs
# here are pointers, never quoted text. See DESIGN.md §API sections.

[api]
id = "H-CONST"
note = '''The exact-rational constant is quoted; the Boolean flavour (payload of bits) is constructed in the same corpus fixture, a few lines below the quoted one.'''

[api.ts]
handle = "hypernet.Builder.constant"
sig_file = "ts/src/hypernet.ts"
sig = ["fn constant"]
snippet_file = "ts/tests/hypernet-native.test.ts"
snippet = "marker:H-CONST"

[api.rust]
handle = "mtk_catalogue::hypernet::HypernetBuilder::constant"
sig_file = "crates/mtk-catalogue/src/hypernet/graph.rs"
sig = ["fn constant"]
snippet_file = "crates/mtk-catalogue/tests/golden_hypernet.rs"
snippet = "marker:H-CONST"
