note = 'Identical to your statement — the amendment is against the Lean \emph{appendix}, not the paper: the appendix\textquotesingle s staging let $\bowtie$ range over all six comparators including $\neq$; the realized payload carries an explicit $\bowtie \neq {\neq}$ field (PROPOSED-B5), restoring the paper\textquotesingle s set. ($\neq$ stays in the formula grammar; it is excluded from this rule.)'

[[rule]]
name = "BernCone"
stratum = "the arithmetic-closure primitive"
tier = 1
tag = "bernCone"
lemmas = ["sound_bernCone"]
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{BernCone}]{
  \Delta = \mathrm{conv}(V_0, \ldots, V_n) \subset \R^n \text{ an } n\text{-simplex};
  \quad S \subsetneq \{0, 1, \ldots, n\}
  \\
  \Phi \vdash x \in \mathcal{R}(\Delta, S)
  \\
  p \colon \R^n \to W \text{ polynomial map of degree } d, \text{ with coefficient tensor } (b_\alpha)_{|\alpha|=d}
  \\
  P \text{ conic predicate on } W \text{ (satisfying set is a convex cone)}
  \\
  \text{for every } j \in \N^S \text{ with } |j| \leq d, \text{ every degree-}d \text{ Bernstein coefficient of } P_j \text{ on } F_S \text{ satisfies } P
}{
  \Phi \vdash P(p(x))
}
\end{mathpar}
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{BernCone}]{
  \Delta = \mathrm{conv}(V_0, \ldots, V_n) \subset \R^n \text{ an } n\text{-simplex};
  \quad S \subsetneq \{0, 1, \ldots, n\}
  \\
  \Phi \vdash x \in \mathcal{R}(\Delta, S)
  \\
  p \colon \R^n \to W \text{ polynomial map of degree } d, \text{ with coefficient tensor } (b_\alpha)_{|\alpha|=d}
  \\
  \wires(p) = \emptyset \;\vee\; \bigl(x = w \,\wedge\, \wires(p) \subseteq \{w\}\bigr)
  \\
  S \neq \emptyset \Rightarrow P \text{ conic}; \qquad S = \emptyset \Rightarrow P \text{ convex suffices}
  \\
  \text{for every } j \in \N^S \text{ with } |j| \leq d, \text{ every degree-}d \text{ Bernstein coefficient of } P_j \text{ on } F_S \text{ satisfies } P
}{
  \Phi \vdash P(p(x))
}
\end{mathpar}
'''
note = 'Two amendments. (i) \texttt{polyTie} (PROPOSED-B10, consult item 12): nothing in the frozen signature tied the checked polynomial\textquotesingle s wire to the region variable — as staged, a certificate could prove its region fact about one wire and run the coefficient check on a polynomial over a different one. Constant polynomials need no tie. (ii) The predicate premise\textquotesingle s two-clause form moves the paper\textquotesingle s own prose license ($S = \emptyset$ admits any convex predicate) from Setup text into the rule. The checker recomputes every forward-difference coefficient — no coefficient tensors ride the wire. \texttt{sound\_bernCone} is now general (leg D3, 2026-07-16): the empty-$S$ case goes through the convex kernel as before, and $S \neq \emptyset$ closes via two new kernels (\texttt{fdBernstein\_sound\_const}, any dimension; \texttt{fdBernstein\_sound\_dim1}, the $(1,1)$ extension ray) — exhaustive because the coefficient check\textquotesingle s own scope guard rejects coordinate polynomials over ambient dimension $\neq 1$. The fully general-shape \texttt{ConeLemma.StarIdentity} route stays open (v1; binds only if that scope guard lifts) but no longer gates the rule\textquotesingle s own soundness.'

# ============================ sp-axiom ============================

[[rule]]
name = "sp[$\\Cell[\\Sigma]$]"
stratum = "sp-axiom (not a proof rule; what the cell rules ride)"
witness = 'M4 one-hot revision — consult item 2 (justification corrected since the morning print run); approval-gated, realized provisionally'
original = '''
\[
\sp[\Cell[\Sigma]] \;=\; \bigvee_{i=1}^N \left( a \in \overline{C_i} \;\wedge\; b_i = 1 \;\wedge\; \bigwedge_{j : a \notin \overline{C_j}} b_j = 0 \right)
\]
'''
amended = '''
\[
\sp[\Cell[\Sigma]] \;=\; \bigvee_{i=1}^N \left( a \in \overline{C_i} \;\wedge\; b_i = 1 \;\wedge\; \bigwedge_{j \neq i} b_j = 0 \right)
\]
'''
