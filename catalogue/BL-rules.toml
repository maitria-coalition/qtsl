# BL-rules.toml — the base-calculus rules source; one entry per deduction rule.
#
# PROVENANCE DISCIPLINE: `original` is David "davidad" Dalrymple's April
# 2026 Bernstein Logic paper (in preparation, \S6-\S7), TeX verbatim --
# never normalized. Empty `original` = no counterpart in the paper (the row
# renders a gray marker on the left and a fully blue right column -- an
# honest new-rule diff). `amended` is a rendering of the CURRENT
# Lean realization (lean/qtsl/Qtsl/{Catalogue,Soundness}.lean) into the
# same metanotation -- distilled, revisable.
#
# MARKS ARE DERIVED LIVE, never hand-maintained (2026-07-17,
# src/marks.rs): each row declares which kernel `lemmas` warrant its check
# mark, an optional `counterexample` (cross mark, or cross-then-check if
# paired with lemmas -- the original staging was unsound, the amendment
# repairs it), or `vacuous` (check with a bottom superscript -- sound only
# because a pending ruling leaves the side-condition uninhabited). At every
# render the tool runs `lake build` + `#print axioms` on every cited lemma
# and refuses to emit a mark over anything outside the standard closure or
# carrying a live sorryAx -- see src/doc.rs field docs for the full schema.
# `note` is tool-voice annotation.
#
# 2026-07-18 resync (schema migrated from the
# hand-maintained `marks`/`witness` strings of the 2026-07-16 print run to
# the live-derivation schema above). The post-D3/D4 marks-flip: Norm (B13),
# Farkas (B14), Subdivide (B11), the ReLU family + LiRPA (B12/B6 port-lookup
# linkage), BernCone (now general, not just $S=\emptyset$), BernCone-Intv
# (the Intv-transport theorem), and Cell-In-Interior/Cell-Out (B2b
# witnessVertex + the CellIntDisjoint schema field) all went from
# open/vacuous/staged-unsound to kernel-proven. Two new core rules
# (EqRefl/EqSym, RATIFIED item 10, core count 12 -> 14) join the page. NOT
# in this pass: the context-carrying $\vee$E ruling (9') is ratified but NOT
# YET realized in Catalogue.lean (POrEData is still the plain form) -- the
# $\vee$E row is schema-migrated but content-unchanged, correctly. Promise
# and Syzygy (core count 14 -> 16, the AG composition layer) keep their
# own page (AG-rules.toml, resynced 2026-07-18); the extraction
# round-trip now counts that page's tagged rows via `rule_enum_also`
# below, so `meta.rule_enum_check` is ON without pre-empting the
# still-open decision on whether the AG layer folds into this page.
#
# 2026-07-18 taxonomy pass (ratified 2026-07-18; names ratified
# ~11:5x): every rule row now carries `tier` — 1 = CORE rule (semantic
# soundness; kernel content), 2 = ADMISSIBLE rule (verified unpacking into
# core rules, 1 node → many — or, for PConstExact, reduction to verified
# checking machinery), 3 = ALIAS rule (verified unpacking into a SINGLE
# admissible-or-core rule application). The sp[Cell] axiom carries no tier
