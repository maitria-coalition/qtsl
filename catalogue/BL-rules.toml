# ==================== composition rules (assume--guarantee) ====================
#
# Folded in from the former AG-rules.toml, 2026-08-02; rows verbatim.
# PROVENANCE (carried from that page): LEFT is the July design-thread
# sketch (2026-07-07, compressed into the 2026-07-16 handoff) -- a
# working sketch, NOT the April paper. RIGHT is the certificate contract
# as realized in Lean (from the 2026-07-16 AG rules draft) -- distilled,
# revisable. All three AG rules were ENDORSED INTO THE CALCULUS by
# design ruling, 2026-07-16 (Promise and Syzygy enter the core calculus,
# with SmallGain admissible); soundness lemmas kernel-proven, sorry-free
# (sound_promise/sound_syzygy, Soundness.lean; sound_smallGain,
# Composition.lean, as a sound_syzygy corollary via
# SmallGainStep.toSyzygy). ProductLattice admitted by design ruling,
# 2026-07-17; SmallGainN ratified 2026-07-28. RESOLVED 2026-07-28: these
# rules are Bernstein Logic outright -- no intermediate "AG layer"
# exists; "assume--guarantee" names their purpose, not a separate
# stratum. One arithmetic core underneath the AG three: SmallGain's
# conclusion is identically the (1,lambda,1,1)-weighted Syzygy
# combination of its four premises -- the cross-supplies cancel by
# construction, so the checker replays a two-line polynomial identity
# and never sees a fixpoint.

[[rule]]
name = "Promise"
stratum = "BL composition: acyclic composition (interface-promise cut); core RuleData constructor, endorsed 2026-07-16 — tier per the 2026-07-18 taxonomy, see note"
tier = 2
tag = "promise"
lemmas = ["sound_promise"]
witness = 'predicate-logic cut over the semantics; realized as core \texttt{RuleData.promise}. Contract existence: K3 \texttt{lem:corridor}; contract extraction: Lemma A (\texttt{farkas\_interpolant\_vars}, kernel-checked)'
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{Promise}]{
  \Phi_1 \vdash Q \\
  \Phi_2 \wedge Q \vdash \Psi
}{
  \Phi_1 \wedge \Phi_2 \vdash \Psi
}
\end{mathpar}
an assumption is an extra generator of the cone; discharging the promise from elsewhere is cut. BL lacks only the bookkeeping tagging interface promises and restricting them to shared variables.
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{Promise}]{
  \Phi_1 \vdash Q \\
  \Phi_2 \wedge Q \vdash \Psi \\
  \wires(Q) \subseteq Y \\
  \wires(\Phi_1) \cap \bigl(\wires(\Phi_2) \cup \wires(\Psi)\bigr) \subseteq Y
}{
  \Phi_1 \wedge \Phi_2 \vdash \Psi
}
\end{mathpar}
Here $Y$ is the declared interface (payload wire list; bundle entries addressed as $\mathrm{TIdx}(w,i)$). The two confinement checks are the locality warrant, not soundness needs: the contract $Q$ is the \emph{datasheet} --- the public artefact whose vocabulary is the separator algebra --- and the cost identities (LP size, ZK disclosure set) quantify over certificates carrying these checks.
'''
note = 'geolog draft: \texttt{PPromise} with supplier/consumer proofs, contract formula, interface declaration; bounded-computation relations \texttt{formulaWiresWithin} (Lemma A\textquotesingle s vars-subset machinery, already formalized) and \texttt{wiresSeparated}. Open payload question for the consult: does $Q$ sit at a fixed conjunct position in the consumer\textquotesingle s pre, or at a payload-declared path (the ctx-$\vee$E style)? TIER NOTE (2026-07-18 taxonomy; two rulings in apparent tension, both yours): the 2026-07-16 19:42 endorsement placed \rulename{Promise} in the core calculus-as-realized (a \texttt{RuleData} constructor, wire tag 25); the 2026-07-18 10:58 taxonomy names \rulename{Promise} an ADMISSIBLE example — and proof-theoretically it is: the unpack is \rulename{Weaken} + $\wedge$-restructuring chains ($\wedge$I/$\wedge$E/Cut) + \rulename{Cut}, one node $\to$ many. Read consistently: TIER is proof-theoretic status (admissible), \texttt{RuleData} membership is implementation/wire placement (native constructor, kept for cost + the locality-warrant payload). The confinement premises are warrant, not soundness — soundness is cut.'

[[rule]]
name = "Syzygy"
stratum = "BL composition: power-preserving interconnection (dialect D); endorsed core 2026-07-16"
tier = 1
tag = "syzygy"
lemmas = ["sound_syzygy"]
witness = 'Lemma B dialect D: pure linearity over the per-entry evaluation lemma; realized as core \texttt{RuleData.syzygy}. Tree effectivity: K3 \texttt{thm:main-subdiv} (RIP $\leftarrow$ wiring, clique support $\leftarrow$ component certificates, margin $\leftarrow$ budget ledger)'
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{Syzygy}]{
  \bigl\{\Gamma_i \vdash s_i - \mathcal{L}_i V_i \geq 0\bigr\}_i \\
  \textstyle\sum_i s_i^{\mathrm{int}} = 0 \ \text{(wiring identity)}
}{
  \textstyle\sum_i \lambda_i(\text{component sequents}) + \text{syzygy} \ = \ \text{composite sequent for } \sum_i \lambda_i V_i
}
\end{mathpar}
power-preserving interconnections compile to a polynomial identity among supply-rate atoms (Tellegen; typically degree 2, effort$\times$flow). Equational; no slack parameter.
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{Syzygy}]{
  \bigl\{\Phi_i \vdash e_i \leq 0\bigr\}_{i=1}^{n} \\
  \bigl\{g_k = 0\bigr\}_k \ \text{equality sub-conjuncts of } \Phi \text{ in wire variables} \\
  \lambda_i \in \Q_{\geq 0} \\
  \nu_k \in \Q \\
  c \equiv \textstyle\sum_i \lambda_i e_i + \sum_k \nu_k g_k \ \text{(exact canonical polynomial)} \\
  \Psi \in \bigl\{\, c \leq 0, \;\; e \geq 0 \text{ where } c = -e, \;\; l \leq r \text{ where } c = l - r \,\bigr\}
}{
  \Phi \vdash \Psi
}
\end{mathpar}
$\Phi \supseteq$ each $\Phi_i$ conjunct-wise (checked); the $\nu_k$ are free-sign exactly as \rulename{Farkas} frees $\lambda_j$ on $=$ atoms --- Lemma A\textquotesingle s CommRing sign-blindness, one theorem for both dialects. Lifts \rulename{Farkas} in exactly two ways: atoms from sub-\emph{proofs} (not sub-conjuncts), atoms of arbitrary polynomial degree. The conclusion is exposed in any of the three \texttt{syzygyConclusionForm} readings --- one exact $\Q$ identity under a sign flip; the transport is the ge-bridge ring lemma, applied once inside \texttt{sound\_syzygy}.
'''
note = 'geolog draft: \texttt{PSyzygy} with proof list, combination Term (the \texttt{combinationCoeffs} compact-encoding style + per-entry source tag \textsc{from-component}/\textsc{from-wiring}), conclusion Term, \texttt{denBoundLog2} (Q7 family); relation \texttt{syzygyCombinationValid}; B14 \texttt{positiveSizeWires} inherited verbatim. BOTH-POLARITY conclusion is CORE here (ratified 2026-07-18; the $\leq$-only \texttt{postEq} this cell displayed through the review wave was the earlier form — resynced in review; witness \texttt{PSyzygyData.postForm : syzygyConclusionForm}, \texttt{Core/Catalogue.lean}). Port-Hamiltonian reading: $e_i = \mathcal{L}_i V_i - s_i^{\mathrm{ext}} - s_i^{\mathrm{int}}$, the $g_k$ cancel the internal supplies, conclusion = dissipation of $\sum_i \lambda_i V_i$. The free-body diagram is the junction tree; internal forces at the cuts are the separator algebra.'

[[rule]]
name = "SmallGain"
stratum = "BL composition: directed feedback (dialect G, guarded fixpoint); alias of \\rulename{Syzygy}, ratified 2026-07-18 — see note"
tier = 3
lemmas = ["sound_smallGain"]
witness = 'proven \emph{as} a \texttt{sound\_syzygy} instance at weights $(1,\lambda,1,1)$ + three $\Q$ comparisons (\texttt{SmallGainStep.toSyzygy}) --- admissible, no tag of its own; $(\lambda,\theta)$-existence stays producer-side; the $n$-component form is catalogued as \rulename{SmallGainN} (next row)'
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{SmallGain}]{
  \mathcal{L}_1 V_1 \leq -\alpha_1(V_1) + \sigma_1(w_2) \\
  \mathcal{L}_2 V_2 \leq -\alpha_2(V_2) + \sigma_2(w_1) \\
  \exists \lambda > 0,\ \theta \in (0,1):\quad \lambda\sigma_2 \preccurlyeq (1{-}\theta)\alpha_1, \quad \sigma_1 \preccurlyeq \lambda(1{-}\theta)\alpha_2
}{
  \mathcal{L}(V_1 + \lambda V_2) \leq -\theta(\alpha_1 + \lambda\alpha_2)
}
\end{mathpar}
the side condition is an LP feasibility over the Bernstein cone; the optimal slack $\theta$ is the guard modulus, travelling in the proof term as a first-class robustness radius.
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{SmallGain}]{
  \Phi_1 \vdash e_1 \leq 0 \\
  \Phi_2 \vdash e_2 \leq 0 \\
  \Phi_w \vdash \lambda\sigma_2 - (1{-}\theta)\,\alpha_1 \leq 0 \\
  \Phi_w \vdash \sigma_1 - \lambda(1{-}\theta)\,\alpha_2 \leq 0 \\
  \lambda \in \Q_{>0} \\
  \theta \in \Q \cap (0,1)
}{
  \Phi \vdash \mathcal{L}(V_1 + \lambda V_2) + \theta\,(\alpha_1 + \lambda\alpha_2) \leq 0
}
\end{mathpar}
$e_i \equiv \mathcal{L}_i V_i + \alpha_i - \sigma_i$; the two membership sequents are ordinary BL sequents over the declared operating box $\Phi_w$, their \rulename{BernCone} multipliers \emph{are} the LP witness. Conclusion identity, checked as exact canonical polynomial: $e_1 + \lambda e_2 + m_1 + m_2 = \mathcal{L}(V_1 + \lambda V_2) + \theta(\alpha_1 + \lambda\alpha_2)$ --- the cross-supplies cancel by construction; the checker never sees a fixpoint.
'''
note = 'geolog draft: \texttt{PSmallGain} with four proof refs, $(\lambda, \theta)$ + six polynomial payload Terms, \texttt{denBoundLog2}; relation \texttt{smallGainShapes}. $\theta$ = the Q6 \texttt{theta\_ref} reservation\textquotesingle s first consumer: per-node in the payload, header = composite modulus (min over nodes). The $(0,1)$ range check is well-formedness backing the published meaning, not a soundness need (the identity holds at any $\theta$; the memberships self-police). Signed polynomial contracts or nothing: {\AA}str\"om--Furuta exploits the \emph{sign} of $\dot\theta\cos\theta$, so norm-gain contracts are constitutively too coarse (Q5, the physical-variable world). $n$-component form: catalogued as \rulename{SmallGainN} (ratified by design ruling, 2026-07-28 --- the same alias tier, one \rulename{Syzygy} node). TIER RESOLVED — ALIAS (design ruling, 2026-07-18: SmallGain is an alias for Syzygy, superseding the earlier example list\textquotesingle s admissible sort): \texttt{SmallGainStep.toSyzygy} is the verified unpacking into a SINGLE core rule — one \rulename{Syzygy} node at weights $(1,\lambda,1,1)$ — and \texttt{sound\_smallGain} closes through it as a \texttt{sound\_syzygy} corollary. The admissible reading\textquotesingle s case (the unpack COMPUTES the weighting and cancellation identity, unlike \rulename{PBound}\textquotesingle s verbatim-payload re-spelling) was on record and is resolved against — gloss: the ratified criterion counts derivation nodes, not instantiation work. Nothing downstream changes (no tag either way).'

[[rule]]
name = "SmallGainN"
stratum = "BL composition: directed feedback over an $n$-component interconnection graph (dialect G, guarded fixpoint); alias of \\rulename{Syzygy}, ratified 2026-07-28 — see note"
tier = 3
witness = 'elaborates to one \rulename{Syzygy} node at weights $(\lambda_1, \ldots, \lambda_n, 1, \ldots, 1)$ --- the exact conclusion identity is the whole obligation, so the target rule\textquotesingle s kernel lemma carries soundness at every instance; the dedicated payload structure + verified $n$-ary unpack (\texttt{SmallGainNStep.toSyzygy}, \texttt{sound\_smallGainN}) is staged, exactly \rulename{SmallGain}\textquotesingle s vehicle at arbitrary $n$'
original = ''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{SmallGainN}]{
  \bigl\{\Phi_i \vdash e_i \leq 0\bigr\}_{i=1}^{n} \\
  \bigl\{\Phi_w \vdash m_i \leq 0\bigr\}_{i=1}^{n} \\
  \Phi \supseteq \Phi_1, \ldots, \Phi_n, \Phi_w \ \text{conjunct-wise (checked)} \\
  \lambda \in \Q_{>0}^{n} \\
  B \in \Q_{\geq 0}^{n \times n} \\
  \textstyle\sum_i B_{ij} = \lambda_j \ (\forall j) \\
  \theta \in \Q \cap (0,1)
}{
  \Phi \vdash \mathcal{L}\bigl(\textstyle\sum_i \lambda_i V_i\bigr) + \theta \textstyle\sum_j \lambda_j \alpha_j \leq 0
}
\end{mathpar}
$e_i \equiv \mathcal{L}_i V_i + \alpha_i - \sigma_i$; \quad $m_i \equiv \lambda_i \sigma_i - (1-\theta) \textstyle\sum_j B_{ij}\, \alpha_j$ (the repayment matrix\textquotesingle s membership rows); \quad conclusion identity, checked as exact canonical polynomial: $\textstyle\sum_i \lambda_i e_i + \sum_i m_i = \mathcal{L}(\sum_i \lambda_i V_i) + \theta \sum_j \lambda_j \alpha_j$ under the column condition.
'''
flavor = '''
the $n$ membership sequents are ordinary BL sequents over the declared operating box $\Phi_w$, their \rulename{BernCone} multipliers \emph{are} the LP witness; the repayment matrix $B$ routes each component\textquotesingle s supply through its neighbours, and the column condition $\sum_i B_{ij} = \lambda_j$ makes every cross-supply cancel in the conclusion identity --- the checker never sees a fixpoint, a spectral radius, or the interconnection graph. Like the binary rule it is an alias: no proof-term sort, no wire tag; it elaborates to one \rulename{Syzygy} node at weights $(\lambda_1, \ldots, \lambda_n, 1, \ldots, 1)$, and $B$ itself never reaches the wire (the membership rows carry it; the exact identity is the whole obligation). The binary rule is the $n = 2$ instance on the nose: $\lambda = (1, \lambda)$, $B_{21} = 1$, $B_{12} = \lambda$ reproduce \rulename{SmallGain}\textquotesingle s membership rows and its $(1, \lambda, 1, 1)$ weights.
'''
note = 'Ratified by design ruling, 2026-07-28. Pure syzygy alias like \rulename{SmallGain}: no new node kind, no wire species, zero checker motion. Existence theory producer-side (LP + Perron--Frobenius: for $\rho(\Gamma) < 1 - \theta$ the Neumann vector $\lambda := \sum_k (1-\theta)^{-k} (\Gamma^{\mathsf{T}})^k \mathbb{1}$ witnesses $\Gamma^{\mathsf{T}}\lambda \le (1-\theta)\lambda$; under-allocation repaired by diagonal padding, which only weakens the membership row it feeds). Literature anchor: Dashkovskiy--R\"uffer--Wirth, \emph{An ISS small gain theorem for general networks}, MCSS 19(2) 2007, pp.\ 93--122, DOI 10.1007/s00498-007-0014-8. Binary recovery checked symbolically at enactment (identity at $n \in \{2,\ldots,5\}$ with fully symbolic $\lambda, B, \theta$, plus a column-sum mutant that breaks it): conclusion and weights on the nose; one labeling difference, stated --- at the binary instance the $n$-ary membership rows come out order-swapped vs the binary rule\textquotesingle s $(m_1, m_2)$, set-equal (combination order is producer bookkeeping). The dedicated Lean payload vehicle is staged; the producer-side builder (\texttt{small\_gain\_n}, mtk catalogue crate) elaborates today.'

[[rule]]
name = "ProductLattice"
stratum = "BL composition, one judgement up: certified attracting-block lattices of wire-disjoint product systems (Kalies--Wehbe; enacted 2026-07-17)"
tier = 2
lemmas = ["sound_productLattice"]
witness = 'transport + weaken, both kernel lemmas (\texttt{Sequent.semanticallyValid\_extend} / \texttt{semanticallyValid\_weaken}); \texttt{sound\_productLattice} discharges every facet sequent of every product block over the disjoint union'
original = ''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{ProductLattice}]{
  B_1 \ \text{a certified attracting-block lattice for } \varphi_1 \ \text{over } H_1
  \\
  B_2 \ \text{likewise for } \varphi_2 \ \text{over } H_2
  \\
  \mathrm{wires}(H_1) \cap \mathrm{wires}(H_2) = \emptyset
}{
  \langle B_1 \times B_2 \rangle_{\vee} \ \text{certified for } \varphi_1 \times \varphi_2 \ \text{over } H_1 \sqcup H_2
}
\end{mathpar}
Here $\langle \cdot \rangle_{\vee}$ is the join-closure of pairwise products. Every composite facet sequent is discharged BY CITATION: a composite facet is normal to one factor\textquotesingle s axis, its inwardness polynomial IS that factor\textquotesingle s facet polynomial with the other factor\textquotesingle s coordinates riding along as free box variables (the rider, conjoined onto the premise). Bernstein-wise the composite facet grid is the factor grid tensored with all-ones --- a coefficient identity; nothing for a checker to recompute beyond the ordinary \rulename{BernCone} recompute pattern.
'''
note = 'Admissible at the JUDGEMENT layer — the taxonomy\textquotesingle s \textquotedblleft QTSL judgement-kinds one layer up\textquotedblright\ family (the ratified tier-2 list names \rulename{ProductLattice} explicitly): one lattice node unpacks to many cited facet sequents. Enacted by design ruling, 2026-07-17 (pressing past the consult note\textquotesingle s own deferral recommendation); Lean realization \texttt{Qtsl/ProductLattice.lean} (soundness = TRANSPORT: a sequent valid over a factor, well-scoped there, stays valid over any wire-extension — then WEAKEN in the rider). Dynamics-free: sound for flows AND maps; the \textquotedblleft whole attractor lattice\textquotedblright\ completeness reading is paper-side, flows-only (KW \texttt{cor\_flows\_att\_iso}). Worked witnesses: \texttt{kw-product/kw\_witnesses.py}, 33/33 reference-checked (2026-07-17); the Lean fixtures port witness A. NO \texttt{RuleTag}/wire constructor yet — wire placement pending (a named follow-up); this page row ships with the post-wave-2 tidy. Source: Kalies--Wehbe, arXiv:2606.30925 (TeX vendored, cited labels verified).'
