[meta]
rule_enum_check = true
title = "Bernstein Logic: the derivation rules, original \\(\\mid\\) amended"
subtitle = "one deduction rule per row \\enspace\\(\\cdot\\)\\enspace \\textcolor{DiffRed}{red = only in the original} \\enspace\\(\\cdot\\)\\enspace \\textcolor{DiffBlue}{blue = only in the amendment} \\enspace\\(\\cdot\\)\\enspace soundness marks derived live, outer margin \\enspace\\(\\cdot\\)\\enspace resync + three-tier taxonomy 18 July 2026"
legend = '''
\textbf{How to read this document.}\enspace Left column: the rules exactly as the April 2026 paper states them (your TeX, verbatim), or a grey marker if the rule has no counterpart there. Right column: the same rules as they now stand in the Lean realization, rendered back into
the same metanotation. Red text on the left is absent from the right; blue text on the
right is absent from the left; black is shared. Margin marks, outer page edge, DERIVED
LIVE at every render:
\cmark\ = a machine-checked soundness lemma covers the rule (kernel-replayed, axiom
closure within propext/Classical.choice/Quot.sound, no live sorry);
\xmark\ = the rule \emph{as originally staged} is disproven by a concrete counterexample;
\xmark$\,\to\,$\cmark\ = the original staging was unsound and the amendment repairs it.
A scope tag on a check means proven for that fragment only -- \(\bot\) means the rule is
\emph{vacuously} sound because a pending ruling leaves its side-condition uninhabited (it
currently rejects every certificate). No mark = soundness open (the v1 frontier). Grey
small print is the tool's voice, not the paper's.

\textbf{The three-tier taxonomy} (your ruling, 18 July 2026): each rule head carries its
tier --- \textbf{core rule} = kernel content, soundness is semantic (proven against the
model, not by unpacking); \textbf{admissible rule} = verified unpacking into core rules
(one node unpacks to a derivation, or reduces to already-verified checking machinery);
\textbf{alias rule} = verified unpacking into a \emph{single} admissible-or-core rule
application (a compact spelling; \rulename{PBound} is the canonical case). The
\(\sp[\Cell]\) axiom carries no tier (not a proof rule). Where a sort is genuinely
arguable the row's note says so with the argument, rather than forcing it.
'''
colophon = '''
\textbf{Provenance and verification.}\enspace Original: the upstream design paper (not included in this repository), \S6--\S7 (12 core rules, the
admissible catalogue, the derived \rulename{ReLU-Split}, and the \(\sp[\Cell]\) axiom the
cell rules ride). Amended: \texttt{lean/qtsl/Qtsl/\{Catalogue,Soundness\}.lean} -- the
current realization, including several PROPOSED payload fields (B2, B5, B6/B12, B10,
B11, B13, B14) that remain approval-gated pending your ruling even where their soundness
lemma is already kernel-proven; builds proceed against them revisably (per-row notes flag
which). Every check mark on this page is re-derived at render time, not hand-maintained:
the tool runs \texttt{lake build} + \texttt{\#print axioms} on each row's cited lemmas and
refuses to render a mark over anything outside the standard closure \([\)propext,
Classical.choice, Quot.sound\(]\) or carrying a live \texttt{sorryAx} -- see the
timestamp/tree stamp below this paragraph. Counterexamples cite \texttt{Soundness.lean}'s
header inventory. This page is generated: the source of truth is
\texttt{metanotation/rules.toml}; re-run \texttt{qtsl-rules} to re-render.
'''

