'''
note = 'New admissible rule (design ruling, 2026-07-18: enact the generalization PConstExact, which subsumes PRatFact; wire tag 27). The calculus previously could not state a ground fact at all — $\vdash -3/4 \leq 0$ had no derivation. Premise-free; $\Phi$ arbitrary (the \rulename{Norm} convention). Closedness is IMPLIED, not a payload field: \texttt{evalClosed} returns \texttt{none} on any wire. $\neq$ is excluded (the \texttt{notNE} field, mirroring \rulename{ArithAtom}\textquotesingle s B5): a wireless $\neq$ atom interprets to $\bot$ under the M$_3$ countermodel, so admitting it against arbitrary $\Phi$ would break \texttt{ProofObject.m3sound} — the semantic lemma covers all six comparators; the admissible set is confined to five. TIER NOTE: admissible by REDUCTION TO VERIFIED MACHINERY (\texttt{sound\_pConstExact} is one step to \texttt{Formula.holds\_of\_evalClosed\_true}), not by unpacking into a catalogue derivation — no such derivation exists, which is the rule\textquotesingle s point; it is not core because it adds zero new kernel semantic content. \rulename{PRatFact} is the corner $e_1 = c$, $e_2 = 0$. COVERAGE: the current \texttt{Term} grammar makes every closed term rank-0, so this is every closed SCALAR exact comparison; the matrix corner (MIX\textquotesingle s exact-matrix-identity) needs closed-tensor constructors + a QTensor-valued closed evaluator — the named next leg, not hand-faked here.'

[[rule]]
name = "PBound"
stratum = "the affine bound-node; a compact spelling of Syzygy"
tier = 3
tag = "pBound"
lemmas = ["sound_pBound"]
original = ''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{PBound}]{
  \bigl\{\Phi_i \vdash e_i \leq 0\bigr\}_{i=1}^{n}, \quad \Phi \supseteq \Phi_i \ \text{conjunct-wise (checked)}
  \\
  \bigl\{g_k = 0\bigr\}_k \ \text{equality sub-conjuncts of } \Phi
  \\
  \lambda_i \in \Q_{\geq 0}
  \\
  \nu_k \in \Q
  \\
  c \equiv \textstyle\sum_i \lambda_i e_i + \sum_k \nu_k g_k \ \text{(exact canonical polynomial)}
  \\
  \bshape_H(c) \neq \bot, \quad \wires(c) \ \text{all finitely typed in } H
  \\
  \wires(\Phi) \cup \wires(c) \cup \textstyle\bigcup_i \wires(e_i) \ \text{all typed at positive-size shapes in } H
  \\
  \Psi \in \bigl\{\, c \leq 0, \;\; e \geq 0 \text{ where } c = -e, \;\; l \leq r \text{ where } c = l - r \,\bigr\}
}{
  \Phi \vdash \Psi
}
\end{mathpar}
'''
note = 'New ALIAS rule (ratified 2026-07-18; wire tag 28) — the taxonomy\textquotesingle s canonical alias: the payload is \texttt{PSyzygyData}\textquotesingle s verbatim, field for field (\texttt{preContains} + B13 \texttt{conclShape}/\texttt{conclFin} + B14 \texttt{wiresPos}/\texttt{compPostWiresPos} inherited unchanged — all now displayed inline above, per the roster-resync; \texttt{denBoundLog2} the Q7 family), \texttt{postForm} included: the conclusion enters through the \texttt{syzygyConclusionForm} reading selector (known before 2026-07-18 as \texttt{boundConclusionForm}, PBound-local — since LANDED as CORE vocabulary on \rulename{Syzygy} itself, ratified 2026-07-18; witness \texttt{PSyzygyData.postForm}/\texttt{PBoundData.postForm}, \texttt{Core/Catalogue.lean}): (Z$\leq$) the raw zero-form — \rulename{Syzygy}\textquotesingle s own conclusion; (G) the ge-polarity flip $-e \leq 0 \rightsquigarrow e \geq 0$ — the FOLDED-IN ge-premise bridge (ABSORBED, never a standalone rule), making \rulename{ReLU-Pos}\textquotesingle s $h \geq 0$ premise reachable from bound facts; (L$\leq$) the literal atom $l \leq r$ where $c = l - r$ — fed to \rulename{LiRPA} with no \rulename{ArithAtom} fold. Unpack: ONE \rulename{Syzygy} node, each reading transported by a one-line ring equivalence (\texttt{sound\_pBound} SPECIALIZES \texttt{sound\_syzygy}); with both-polarity now core on \rulename{Syzygy}, the alias relation is 1$\to$1 at reading level too. The affine restriction is wire-format compactness (register-2 coefficient rows), not a checked side condition: soundness never needs it.'

[[rule]]
name = "PSDCERT/T"
stratum = "exact-matrix positive-definiteness witness fact (triangular-inverse tier); premise-free"
tier = 2
tag = "psdCertT"
lemmas = ["sound_psdCertT"]
original = ''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{PSDCERT/T}]{
  A \in \Q^{n \times n} \ \text{symmetric}
  \\
  Z \ \text{upper-triangular}, \ Z_{ii} > 0
  \\
  A \cdot Z \ \text{lower-triangular}, \ (A \cdot Z)_{ii} > 0 \ \text{(recomputed exactly)}
  \\
  p_1, \dots, p_n \ \text{payload terms}
  \\
  c \equiv -\textstyle\sum_{i,j} A_{ij}\, p_i\, p_j \ \text{(exact canonical polynomial)}
  \\
  \Psi \in \bigl\{\, c \leq 0, \;\; Q \geq 0 \text{ where } c = -Q, \;\; l \leq r \text{ where } c = l - r \,\bigr\}
}{
  \Phi \vdash \Psi
}
\end{mathpar}
'''
note = 'New admissible rule (design ruling, 2026-07-18: include all three PSDCERT variants; shipped with catalogue wave 2). The triangular-inverse theorem, all-syntactic premises: the three matrix checks warrant $A \succ 0$ over $\R$ (\texttt{PsdCert.checkT\_posDef}), division-free, $O(\alpha n^2)$ multiplications, exact $\Q$ arithmetic on the zero-mathlib checker closure. The IN-LOGIC fact is the quadratic form\textquotesingle s nonnegativity at the payload terms, entering through \texttt{syzygyConclusionForm} (both-polarity, wave-2 core) — a component conclusion for \rulename{Syzygy}/\rulename{Farkas} combinations; MIX\textquotesingle s LDL-PSD-witness obligation node. Strictness is deliberately dropped at the formula boundary: $\succ$ is certified matrix-side, but the premise-free atom is the $\succcurlyeq$-shaped form (strictness needs $x \neq 0$, which no premise-free atom carries). $\Phi$ arbitrary (the \rulename{Norm} convention); soundness never consults witness accuracy — a forged $Z$ can only refuse, never falsely accept. Elementwise atom semantics batch the fact: tensor-shaped payload terms give per-entry PSD application for free. TIER NOTE: admissible by reduction to the verified \texttt{PsdCert} matrix theorems (the \rulename{PConstExact} pattern), not by unpacking into a catalogue derivation. Wire tag deferred to the payload-window allocation (with tags 27/28); the emit path refuses until allocated.'

