[[rule]]
name = "EqElim"
stratum = "equality"
tier = 1
tag = "eqElim"
lemmas = ["sound_eqElim"]
counterexample = 'counterexample: the broadcast equality $3/2 = [3/2]$ rewrites a region atom into an unsatisfiable conclusion from a satisfiable premise (\texttt{Soundness.lean} header)'
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{EqElim}]{\Phi \vdash t = u \\ \Phi \vdash \Psi\sub{a}{t}}{\Phi \vdash \Psi\sub{a}{u}}
\end{mathpar}
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{EqElim}]{\Phi \vdash t = u \\ \Phi \vdash \Psi\sub{a}{t} \\ \exists s.\; \bshape_H(t) = s = \bshape_H(u)}{\Phi \vdash \Psi\sub{a}{u}}
\end{mathpar}
'''
note = 'The new premise is the PROPOSED-B13 \texttt{tyEq} payload field: the equation\textquotesingle s sides carry a common broadcast shape in the hypernet ($\bshape_H$ is the realized broadcast-shape function on terms). Without it, Leibniz substitution across a scalar-to-vector broadcast equality is unsound in region contexts — the equality holds without the terms being interchangeable.'

[[rule]]
name = "EqRefl"
stratum = "equality structure (RATIFIED item 10, 2026-07-16)"
tier = 1
tag = "eqRefl"
lemmas = ["sound_eqRefl"]
original = ''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{EqRefl}]{\exists s.\; \bshape_H(t) = s \\ \wires(t) \text{ finitely typed in } H}{\Phi \vdash t = t}
\end{mathpar}
'''
note = 'New core rule (item 10; core count 12 $\to$ 14): reflexivity as a first-class rule rather than an assumed fact, needed because \texttt{Term} equality is by evaluation and an ill-typed or $\infty$-valued term can fail to self-evaluate under the semantics (\rulename{Norm}\textquotesingle s B13 lesson, generalized) — the well-typedness premises are exactly what keeps \rulename{EqRefl} from asserting $\bot \vdash t = t$ vacuously. No counterpart in the April paper (the appendix used reflexivity informally); wire tag 23, BINARY.md \S4. TIER FLAG (arguable): to the extent every \texttt{Term} canonicalizes, \rulename{EqRefl} coincides with \rulename{Norm}\textquotesingle s diagonal $t_1 = t_2 = t$ — an alias-shaped single-node unpack; sorted core as RATIFIED, and the v0 fragment (which excludes \rulename{Norm} outright) needs it to stand alone regardless.'

[[rule]]
name = "EqSym"
stratum = "equality structure (RATIFIED item 10, 2026-07-16)"
tier = 1
tag = "eqSym"
lemmas = ["sound_eqSym"]
original = ''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{EqSym}]{\Phi \vdash t = u}{\Phi \vdash u = t}
\end{mathpar}
'''
note = 'New core rule (same ratification): the flipped orientation, previously reachable only by re-deriving through \rulename{EqElim} against an $x = t \to x = u$ template. An earlier R2 alternative (an orientation-flag field bolted onto the existing equality rules) was retired un-built in favour of this free-standing constructor. No counterpart in the April paper; wire tag 24. TIER FLAG (arguable): the \rulename{EqRefl}+\rulename{EqElim} unpack is two nodes (admissible-shaped, not alias) and only goes through where the well-typedness side data is syntactically available — the obstruction that motivated the primitive constructor; sorted core as RATIFIED.'

[[rule]]
name = "ConvElim"
stratum = "region atoms"
tier = 1
tag = "convElim"
lemmas = ["sound_convElim"]
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{ConvElim}]{
  \Phi \vdash x \in \mathcal{R}(\Delta, S)
}{
  \Phi \vdash \textstyle\bigwedge_{i \in S} \lambda_i(x) \leq 0 \;\wedge\; \bigwedge_{i \in \bar S} \lambda_i(x) \geq 0
}
\end{mathpar}
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{ConvElim}]{
  \Phi \vdash x \in \mathcal{R}(\Delta, S)
}{
  \Phi \vdash \textstyle\bigwedge_{i = 0}^{n} \mathrm{canon}(\epsilon_i\,\lambda_i(x)) \leq 0 \\ \epsilon_i \,=\, {+1} \text{ if } i \in S, \quad {-1} \text{ if } i \in \bar S
}
\end{mathpar}
'''
note = 'Same content; the realized conjunction is flat, in support-vertex order (one atom per $\lambda_i$), ALL-$\leq$: the complement vertex\textquotesingle s wanted $\lambda_i \geq 0$ is sign-folded into the term, because the calculus has no $\leq/\geq$ flip rule and a $\geq$-atom would connect to nothing (producer finding F4, adopted 2026-07-18, superseding leg C\textquotesingle s mixed-polarity offset-first convention this cell previously displayed — the wave-1 cell-vs-realization polarity drift, resynced in review). $\mathrm{canon}$ is the primitive-integer positive rescale with degree-sorted atom body $s^{\prime}\!\cdot x + c^{\prime}$, constant dropped when zero. Witness: \texttt{f4VertexAtom}/\texttt{f4Lhs}/\texttt{primAffine}/\texttt{barycentricHalfspaceBuild}, \texttt{Core/Catalogue.lean}; emitter and wire format share it.'

