name = "ConvIntro"
stratum = "region atoms"
tier = 1
tag = "convIntro"
lemmas = ["sound_convIntro"]
counterexample = 'counterexample: \rulename{Ax} on the barycentric conjunction at $t := 3/2$ over $\Delta = \mathrm{conv}(1,2)$ derives $\vdash (3/2 : \mathrm{Term}) \in \Delta$, false at every valuation (\texttt{Soundness.lean} header)'
original = '''
\begin{mathpar}
\inferrule*[Right=\rulename{ConvIntro}]{
  \Phi \vdash \textstyle\bigwedge_{i \in S} \lambda_i(x) \leq 0 \;\wedge\; \bigwedge_{i \in \bar S} \lambda_i(x) \geq 0
}{
  \Phi \vdash x \in \mathcal{R}(\Delta, S)
}
\end{mathpar}
'''
amended = '''
\begin{mathpar}
\inferrule*[Right=\rulename{ConvIntro}]{
  \Phi \vdash \textstyle\bigwedge_{i = 0}^{n} \mathrm{canon}(\epsilon_i\,\lambda_i(x)) \leq 0 \\ \epsilon_i \,=\, {+1} \text{ if } i \in S, \ {-1} \text{ if } i \in \bar S \\ \bshape_H(x) = [\,n\,]
}{
  \Phi \vdash x \in \mathcal{R}(\Delta, S)
}
\end{mathpar}
'''
note = 'The shape premise is the PROPOSED-B13 \texttt{termShape} field (with the B1 shape fix): the region term is a rank-1 tensor of extent $n$ — geolog\textquotesingle s \texttt{ax/wf/FInRegion\_shape} restored at the introduction rule. Without it a scalar-termed region conclusion is derivable while semantically unsatisfiable. The premise conjunction is the same all-$\leq$ sign-folded F4 form as \rulename{ConvElim}\textquotesingle s conclusion (one \texttt{barycentricHalfspaceForm}, consumed here, produced there — the polarity resync applies to both cells at once).'

